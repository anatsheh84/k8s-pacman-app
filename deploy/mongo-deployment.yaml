apiVersion: v1
kind: Namespace
metadata:
  name: pacman-app
  annotations:
    openshift.io/sa.scc.uid-range: "1000840000/10000"
    openshift.io/sa.scc.supplemental-groups: "1000840000/10000"
    openshift.io/sa.scc.mcs: "s0:c29,c14"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: mongo
    app.kubernetes.io/name: pacman
  name: mongo
  namespace: pacman-app
spec:
  replicas: 1
  selector:
    matchLabels:
      name: mongo
      app.kubernetes.io/name: pacman
  template:
    metadata:
      labels:
        name: mongo
        app.kubernetes.io/name: pacman
    spec:
      containers:
      - image: bitnamilegacy/mongodb:5.0.10
        name: mongo
        ports:
        - name: mongo
          containerPort: 27017
        volumeMounts:
          - name: mongo-db
            mountPath: /bitnami/mongodb
      volumes:
        - name: mongo-db
          persistentVolumeClaim:
            claimName: mongo-storage
