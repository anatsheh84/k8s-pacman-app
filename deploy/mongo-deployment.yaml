apiVersion: v1
kind: Namespace
metadata:
  name: pacman-app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: pacman-app
  labels:
    name: mongo
    app.kubernetes.io/name: pacman
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  # storageClassName intentionally omitted — uses each cluster's default SC
  # (gp3-csi on OCP, gp2 on EKS, ocs-storagecluster-ceph-rbd on ODF clusters).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: mongo
    app.kubernetes.io/name: pacman
  name: mongo
  namespace: pacman-app
spec:
  replicas: 1
  strategy:
    type: Recreate          # PVC is RWO; can't have two pods mounting it
  selector:
    matchLabels:
      name: mongo
      app.kubernetes.io/name: pacman
  template:
    metadata:
      labels:
        name: mongo
        app.kubernetes.io/name: pacman
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
      - name: fix-perms
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 1001:1001 /bitnami/mongodb"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: mongo-db
            mountPath: /bitnami/mongodb
      containers:
      - image: bitnamilegacy/mongodb:5.0.10
        name: mongo
        ports:
        - name: mongo
          containerPort: 27017
        volumeMounts:
          - name: mongo-db
            mountPath: /bitnami/mongodb
      volumes:
        - name: mongo-db
          persistentVolumeClaim:
            claimName: mongo-data
